<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dibbur QA harness</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Minimal Tauri IPC stub, installed before any app module loads so the
      // real components mount in a plain browser. Commands get a plausible
      // answer or a clean rejection (their catch blocks use defaults).
      (function () {
        var qaCallbacks = new Map();
        var qaListeners = new Map();
        var qaCallbackSeq = 1;
        var qaEventSeq = 1;
        window.__qaEmit = function (event, payload) {
          var cbId = qaListeners.get(event);
          if (cbId === undefined) return;
          var cb = qaCallbacks.get(cbId);
          if (cb) cb({ event: event, id: qaEventSeq++, payload: payload });
        };
        window.__TAURI_INTERNALS__ = {
          transformCallback: function (cb) {
            var id = qaCallbackSeq++;
            qaCallbacks.set(id, cb);
            return id;
          },
          unregisterCallback: function (id) {
            qaCallbacks.delete(id);
          },
          invoke: async function (cmd, args) {
            if (
              new URLSearchParams(location.search).get("view") === "updater"
            ) {
              window.qaCalls = window.qaCalls || [];
              window.qaCalls.push(cmd);
              var mode = new URLSearchParams(location.search).get("ustate");
              if (cmd === "plugin:app|version") return "1.0.10";
              if (cmd === "get_transcription_model_status")
                return "ivrit-turbo";
              if (cmd === "plugin:updater|check") {
                if (mode === "error") throw new Error("offline");
                if (mode === "current") return null;
                return {
                  rid: 42,
                  available: true,
                  version: "1.0.11",
                  currentVersion: "1.0.10",
                  rawJson: { version: "1.0.11" },
                };
              }
              if (cmd === "is_portable") return mode === "portable";
              if (cmd === "plugin:updater|download") {
                args.onEvent.onmessage({
                  event: "Started",
                  data: { contentLength: 100 },
                });
                args.onEvent.onmessage({
                  event: "Progress",
                  data: { chunkLength: 45 },
                });
                if (mode === "downloading") await new Promise(() => {});
                return 43;
              }
              if (cmd === "begin_app_update") return mode !== "busy";
              if (
                cmd === "plugin:updater|install" ||
                cmd === "plugin:process|restart" ||
                cmd === "end_app_update" ||
                cmd === "plugin:resources|close"
              )
                return null;
            }
            if (cmd === "plugin:event|listen") {
              qaListeners.set(args.event, args.handler);
              return qaEventSeq++;
            }
            if (cmd === "plugin:event|unlisten" || cmd === "plugin:event|emit")
              return null;
            if (cmd === "get_app_settings")
              return {
                overlay_position: "bottom",
                always_on_microphone: true,
                audio_feedback: true,
                mute_while_recording: true,
                selected_language: "auto",
                theme: "dark",
                shortcut_activation: "hold_or_toggle",
                bindings: {
                  transcribe: {
                    id: "transcribe",
                    name: "Transcribe Shortcut",
                    description: "",
                    default_binding: "option+space",
                    current_binding: "option+space",
                  },
                },
              };
            throw new Error("harness stub: no Tauri backend for " + cmd);
          },
          convertFileSrc: function (p) {
            return p;
          },
          metadata: {},
          plugins: {},
        };
        window.__TAURI_OS_PLUGIN_INTERNALS__ = {
          eol: "\n",
          platform: "macos",
          version: "15.0",
          family: "unix",
          os_type: "macos",
          arch: "aarch64",
          exe_extension: "",
        };
      })();
    </script>
    <script type="module" src="/src/harness.tsx"></script>
  </body>
</html>
