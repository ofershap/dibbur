name: "Mac Build (stable self-signed)"

on: workflow_dispatch

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-26"
            target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            target: "x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.platform }}-${{ matrix.target }}-unsigned-v1
          cache-bin: false

      - name: install frontend dependencies
        run: bun install

      - name: Import stable self-signed signing certificate
        env:
          DIBBUR_SIGNING_P12: ${{ secrets.DIBBUR_SIGNING_P12 }}
          DIBBUR_SIGNING_P12_PASSWORD: ${{ secrets.DIBBUR_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=dibbur-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$DIBBUR_SIGNING_P12" | base64 --decode > signing.p12
          security import signing.p12 -k "$KEYCHAIN" -P "$DIBBUR_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm signing.p12
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build with Tauri (stable self-signed)
        env:
          APPLE_SIGNING_IDENTITY: "Dibbur Local Signing"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Verify signature
        run: |
          APP=$(ls -d src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Signature|Authority|TeamIdentifier|CDHash' || true
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Upload dmg and updater artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dibbur-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
